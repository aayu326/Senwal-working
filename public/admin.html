<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel — Sanwal & Associates</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --blue-dark: #07152b;
  --blue-mid: #0f2444;
  --gold: #c9a84c;
  --gold-light: #e2c87a;
  --white: #ffffff;
  --off-white: #f5f2ec;
  --text-muted: #8aaec8;
  --danger: #e05252;
  --success: #4caf7d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Jost', sans-serif; background: var(--off-white); color: var(--blue-dark); }

/* ── LOGIN SCREEN ── */
#loginScreen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--blue-dark);
}
.login-box {
  background: #0f2444; border: 1.5px solid rgba(201,168,76,0.25);
  padding: 52px 48px; width: 100%; max-width: 420px;
}
.login-box h1 { font-family: 'Cormorant Garamond', serif; color: var(--white); font-size: 28px; margin-bottom: 6px; }
.login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 36px; }
.login-box input {
  width: 100%; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(201,168,76,0.2);
  color: var(--white); padding: 14px 16px; font-family: 'Jost', sans-serif; font-size: 14px;
  outline: none; margin-bottom: 16px; transition: border 0.3s;
}
.login-box input:focus { border-color: var(--gold); }
.login-box input::placeholder { color: rgba(138,174,200,0.4); }
.btn-gold {
  width: 100%; background: var(--gold); color: var(--blue-dark); border: none;
  padding: 14px; font-size: 12px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif;
  transition: all 0.3s;
}
.btn-gold:hover { background: var(--gold-light); }
.login-err { color: #e05252; font-size: 12px; margin-top: 10px; display: none; }

/* ── ADMIN LAYOUT ── */
#adminPanel { display: none; min-height: 100vh; }
.admin-nav {
  background: var(--blue-dark); padding: 0 40px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid rgba(201,168,76,0.2); position: sticky; top: 0; z-index: 100;
}
.admin-nav h1 { font-family: 'Cormorant Garamond', serif; color: var(--white); font-size: 20px; }
.admin-nav h1 span { color: var(--gold); }
.nav-right { display: flex; gap: 12px; align-items: center; }
.nav-tab {
  background: transparent; border: 1.5px solid rgba(201,168,76,0.3); color: var(--text-muted);
  padding: 8px 18px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif;
  transition: all 0.3s;
}
.nav-tab.active, .nav-tab:hover { background: var(--gold); color: var(--blue-dark); border-color: var(--gold); }
.logout-btn {
  background: transparent; border: 1.5px solid rgba(224,82,82,0.4); color: #e05252;
  padding: 8px 16px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.3s;
}
.logout-btn:hover { background: rgba(224,82,82,0.1); }

.admin-body { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── STATS ── */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
.stat-card {
  background: var(--white); border: 1.5px solid #e8e0d0; padding: 24px 28px;
  border-left: 4px solid var(--gold);
}
.stat-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 38px; color: var(--gold); }
.stat-card p { color: #777; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

/* ── POST FORM ── */
.form-card {
  background: var(--white); border: 1.5px solid #e8e0d0; padding: 36px;
  position: relative; overflow: hidden; margin-bottom: 32px;
}
.form-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}
.form-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 24px; color: var(--blue-dark); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #555; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; background: var(--off-white); border: 1.5px solid #ddd;
  color: var(--blue-dark); padding: 12px 14px; font-family: 'Jost', sans-serif;
  font-size: 14px; outline: none; transition: all 0.3s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--gold); background: var(--white); box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
}
.form-group textarea { height: 140px; resize: vertical; }
.form-group textarea.content-editor { height: 280px; font-size: 13px; line-height: 1.7; }
.form-actions { display: flex; gap: 12px; margin-top: 8px; }
.btn-submit {
  background: var(--gold); color: var(--blue-dark); border: none;
  padding: 13px 32px; font-size: 11px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.3s;
}
.btn-submit:hover { background: var(--gold-light); }
.btn-cancel {
  background: transparent; color: #777; border: 1.5px solid #ddd;
  padding: 13px 24px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.3s;
}
.btn-cancel:hover { border-color: #aaa; color: #444; }
.toast {
  position: fixed; bottom: 28px; right: 28px; background: var(--blue-dark);
  color: var(--white); padding: 14px 24px; font-size: 13px; border-left: 4px solid var(--gold);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3); transform: translateY(100px); opacity: 0;
  transition: all 0.4s ease; z-index: 9999;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-left-color: var(--danger); }

/* ── POSTS TABLE ── */
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; }
.filter-tabs { display: flex; gap: 8px; }
.filter-tab {
  background: transparent; border: 1.5px solid #ddd; color: #777;
  padding: 7px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
  text-transform: uppercase; cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.25s;
}
.filter-tab.active, .filter-tab:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.07); }
.posts-table { width: 100%; border-collapse: collapse; background: var(--white); }
.posts-table th {
  background: var(--blue-dark); color: var(--text-muted); font-size: 10px;
  letter-spacing: 1.5px; text-transform: uppercase; padding: 14px 16px; text-align: left; font-weight: 600;
}
.posts-table td { padding: 14px 16px; border-bottom: 1px solid #f0ebe0; font-size: 13px; vertical-align: middle; }
.posts-table tr:hover td { background: #faf7f0; }
.post-title-cell { max-width: 300px; }
.post-title-cell strong { display: block; color: var(--blue-dark); font-size: 13.5px; margin-bottom: 3px; }
.post-title-cell span { color: #999; font-size: 11px; }
.badge {
  display: inline-block; padding: 3px 10px; font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.badge-blog { background: rgba(76,175,125,0.12); color: #4caf7d; }
.badge-pub { background: rgba(201,168,76,0.12); color: var(--gold); }
.badge-draft { background: rgba(224,82,82,0.12); color: var(--danger); }
.badge-live { background: rgba(76,175,125,0.12); color: #4caf7d; }
.action-btns { display: flex; gap: 8px; }
.btn-edit {
  background: transparent; border: 1.5px solid rgba(201,168,76,0.4); color: var(--gold);
  padding: 6px 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
  cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.25s; text-transform: uppercase;
}
.btn-edit:hover { background: rgba(201,168,76,0.1); }
.btn-delete {
  background: transparent; border: 1.5px solid rgba(224,82,82,0.3); color: var(--danger);
  padding: 6px 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
  cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.25s; text-transform: uppercase;
}
.btn-delete:hover { background: rgba(224,82,82,0.08); }
.btn-toggle {
  background: transparent; border: 1.5px solid #ddd; color: #777;
  padding: 6px 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
  cursor: pointer; font-family: 'Jost', sans-serif; transition: all 0.25s; text-transform: uppercase;
}
.btn-toggle:hover { border-color: #aaa; }
.empty-state { text-align: center; padding: 60px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Sanwal <span style="color:var(--gold)">&</span> Associates</h1>
    <p>Admin Panel — Knowledge Hub CMS</p>
    <input type="password" id="adminPassword" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')login()"/>
    <button class="btn-gold" onclick="login()">Login to Admin Panel</button>
    <div class="login-err" id="loginErr">❌ Incorrect password. Try again.</div>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="adminPanel">

  <!-- Nav -->
  <nav class="admin-nav">
    <h1>Sanwal <span>&</span> Associates — Admin</h1>
    <div class="nav-right">
      <button class="nav-tab active" onclick="showPanel('dashboard')">Dashboard</button>
      <button class="nav-tab" onclick="showPanel('new')">+ New Post</button>
      <button class="nav-tab" onclick="showPanel('posts')">All Posts</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="admin-body">

    <!-- ── DASHBOARD ── -->
    <div class="panel active" id="panel-dashboard">
      <div class="stats-row">
        <div class="stat-card"><h3 id="statBlogs">—</h3><p>Total Blogs</p></div>
        <div class="stat-card"><h3 id="statPubs">—</h3><p>Total Publications</p></div>
        <div class="stat-card"><h3 id="statDrafts">—</h3><p>Drafts (Unpublished)</p></div>
      </div>
      <div class="form-card" style="padding:28px 36px;">
        <h2>Quick Actions</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn-submit" onclick="showPanel('new');setType('blog')">✍️ Write New Blog</button>
          <button class="btn-submit" style="background:#0f2444;color:var(--gold);" onclick="showPanel('new');setType('publication')">📄 Add Publication</button>
          <button class="btn-cancel" onclick="showPanel('posts')">📋 View All Posts</button>
        </div>
      </div>
    </div>

    <!-- ── NEW POST FORM ── -->
    <div class="panel" id="panel-new">
      <div class="form-card">
        <h2 id="formTitle">Write New Blog / Publication</h2>
        <input type="hidden" id="editPostId"/>

        <div class="form-row">
          <div class="form-group">
            <label>Post Type</label>
            <select id="postType">
              <option value="blog">📰 Blog / Insight</option>
              <option value="publication">📄 Firm Publication</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="postCategory">
              <option>Legal Update</option>
              <option>LPO Insight</option>
              <option>Regulatory Alert</option>
              <option>White Paper</option>
              <option>Legal Bulletin</option>
              <option>Commentary</option>
              <option>Case Study</option>
              <option>Guide</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="postTitle" placeholder="Enter post title..."/>
        </div>

        <div class="form-group">
          <label>Excerpt / Short Description *</label>
          <textarea id="postExcerpt" placeholder="A short summary shown on the main website (2-3 lines)..." style="height:80px;"></textarea>
        </div>

        <div class="form-group">
          <label>Full Content *</label>
          <textarea class="content-editor" id="postContent" placeholder="Write the full blog/publication content here. You can use basic HTML tags like &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;li&gt;, &lt;strong&gt; etc."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Author</label>
            <input type="text" id="postAuthor" value="Sanwal & Associates" placeholder="Author name"/>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="postDate"/>
          </div>
        </div>

        <div class="form-group">
          <label>Cover Image URL (for blogs — leave blank for publications)</label>
          <input type="url" id="postImage" placeholder="https://images.unsplash.com/..."/>
        </div>

        <div class="form-group">
          <label>Status</label>
          <select id="postPublished">
            <option value="true">✅ Published (Live on website)</option>
            <option value="false">📝 Draft (Not visible on website)</option>
          </select>
        </div>

        <div class="form-actions">
          <button class="btn-submit" onclick="savePost()">💾 Save &amp; Publish</button>
          <button class="btn-cancel" onclick="resetForm();showPanel('posts')">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ── ALL POSTS TABLE ── -->
    <div class="panel" id="panel-posts">
      <div class="section-header">
        <h2>All Posts</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="filterPosts('all',this)">All</button>
          <button class="filter-tab" onclick="filterPosts('blog',this)">Blogs</button>
          <button class="filter-tab" onclick="filterPosts('publication',this)">Publications</button>
          <button class="filter-tab" onclick="filterPosts('draft',this)">Drafts</button>
        </div>
      </div>
      <table class="posts-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Category</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="postsTableBody">
          <tr><td colspan="6" class="empty-state">Loading posts...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────
let adminPassword = '';
let allPosts = { blogs: [], publications: [] };
let currentFilter = 'all';
const API = 'http://localhost:8000';

// ── Login ──────────────────────────────────────────────────────
async function login() {
  const pw = document.getElementById('adminPassword').value;
  if (!pw) return;

  const res = await fetch(`${API}/admin/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  const data = await res.json();

  if (data.success) {
    adminPassword = pw;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    // Set today's date
    document.getElementById('postDate').value = new Date().toISOString().split('T')[0];
    loadPosts();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

function logout() {
  adminPassword = '';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('adminPassword').value = '';
}

// ── Panel Navigation ───────────────────────────────────────────
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => {
    if (t.textContent.toLowerCase().includes(name === 'dashboard' ? 'dash' : name === 'new' ? 'new' : 'all')) {
      t.classList.add('active');
    }
  });
  if (name === 'posts') loadPosts();
}

function setType(type) {
  document.getElementById('postType').value = type;
}

// ── Load Posts ─────────────────────────────────────────────────
async function loadPosts() {
  const res = await fetch(`${API}/admin/posts`, {
    headers: { 'x-admin-password': adminPassword }
  });
  allPosts = await res.json();

  // Update stats
  const drafts = [...allPosts.blogs, ...allPosts.publications].filter(p => !p.published).length;
  document.getElementById('statBlogs').textContent = allPosts.blogs.length;
  document.getElementById('statPubs').textContent = allPosts.publications.length;
  document.getElementById('statDrafts').textContent = drafts;

  renderTable(currentFilter);
}

function renderTable(filter) {
  currentFilter = filter;
  let posts = [...allPosts.blogs, ...allPosts.publications];
  if (filter === 'blog') posts = allPosts.blogs;
  else if (filter === 'publication') posts = allPosts.publications;
  else if (filter === 'draft') posts = posts.filter(p => !p.published);

  // Sort by date desc
  posts.sort((a, b) => new Date(b.date) - new Date(a.date));

  const tbody = document.getElementById('postsTableBody');
  if (posts.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No posts found.</td></tr>';
    return;
  }

  tbody.innerHTML = posts.map(post => `
    <tr>
      <td class="post-title-cell">
        <strong>${post.title}</strong>
        <span>${post.excerpt ? post.excerpt.substring(0, 60) + '...' : ''}</span>
      </td>
      <td><span class="badge ${post.type === 'blog' ? 'badge-blog' : 'badge-pub'}">${post.type === 'blog' ? 'Blog' : 'Publication'}</span></td>
      <td>${post.category || '—'}</td>
      <td>${formatDate(post.date)}</td>
      <td><span class="badge ${post.published ? 'badge-live' : 'badge-draft'}">${post.published ? 'Live' : 'Draft'}</span></td>
      <td>
        <div class="action-btns">
          <button class="btn-edit" onclick="editPost('${post.id}')">Edit</button>
          <button class="btn-toggle" onclick="togglePublish('${post.id}', ${!post.published})">${post.published ? 'Unpublish' : 'Publish'}</button>
          <button class="btn-delete" onclick="deletePost('${post.id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filterPosts(type, btn) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTable(type);
}

// ── Save Post ──────────────────────────────────────────────────
async function savePost() {
  const id = document.getElementById('editPostId').value;
  const title = document.getElementById('postTitle').value.trim();
  const excerpt = document.getElementById('postExcerpt').value.trim();
  const content = document.getElementById('postContent').value.trim();

  if (!title || !excerpt || !content) {
    showToast('❌ Title, excerpt and content are required.', true);
    return;
  }

  const postData = {
    type: document.getElementById('postType').value,
    category: document.getElementById('postCategory').value,
    title,
    excerpt,
    content,
    author: document.getElementById('postAuthor').value || 'Sanwal & Associates',
    date: document.getElementById('postDate').value,
    image: document.getElementById('postImage').value || '',
    published: document.getElementById('postPublished').value === 'true'
  };

  let res;
  if (id) {
    // Update existing
    res = await fetch(`${API}/admin/post/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify(postData)
    });
  } else {
    // Create new
    res = await fetch(`${API}/admin/post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify(postData)
    });
  }

  const data = await res.json();
  if (data.success) {
    showToast('✅ Post saved successfully!');
    resetForm();
    loadPosts();
    showPanel('posts');
  } else {
    showToast('❌ Failed to save post.', true);
  }
}

// ── Edit Post ──────────────────────────────────────────────────
function editPost(id) {
  const all = [...allPosts.blogs, ...allPosts.publications];
  const post = all.find(p => p.id === id);
  if (!post) return;

  document.getElementById('editPostId').value = post.id;
  document.getElementById('postType').value = post.type;
  document.getElementById('postCategory').value = post.category || 'Legal Update';
  document.getElementById('postTitle').value = post.title;
  document.getElementById('postExcerpt').value = post.excerpt;
  document.getElementById('postContent').value = post.content;
  document.getElementById('postAuthor').value = post.author;
  document.getElementById('postDate').value = post.date;
  document.getElementById('postImage').value = post.image || '';
  document.getElementById('postPublished').value = post.published ? 'true' : 'false';
  document.getElementById('formTitle').textContent = 'Edit Post';

  showPanel('new');
  window.scrollTo(0, 0);
}

// ── Toggle Publish ─────────────────────────────────────────────
async function togglePublish(id, published) {
  const res = await fetch(`${API}/admin/post/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
    body: JSON.stringify({ published })
  });
  const data = await res.json();
  if (data.success) {
    showToast(published ? '✅ Post published!' : '📝 Post moved to draft.');
    loadPosts();
  }
}

// ── Delete Post ────────────────────────────────────────────────
async function deletePost(id) {
  if (!confirm('Are you sure you want to delete this post? This cannot be undone.')) return;

  const res = await fetch(`${API}/admin/post/${id}`, {
    method: 'DELETE',
    headers: { 'x-admin-password': adminPassword }
  });
  const data = await res.json();
  if (data.success) {
    showToast('🗑️ Post deleted.');
    loadPosts();
  }
}

// ── Reset Form ─────────────────────────────────────────────────
function resetForm() {
  document.getElementById('editPostId').value = '';
  document.getElementById('postType').value = 'blog';
  document.getElementById('postCategory').value = 'Legal Update';
  document.getElementById('postTitle').value = '';

// ── Helpers ────────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3500);
}
</script>
